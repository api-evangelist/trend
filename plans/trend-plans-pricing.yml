overage: >-
  None. There is no overage or subscription — brands buy another package when credits
  run out. Trend's pricing page states "no subscription or platform fees".
limits_attached_to_tier: >-
  The only limit attached to a package is the credit balance itself. A single creator
  hire consumes 20, 40 or 60 credits depending on the creator's level
  (PublicProfileResponse.partnershipCreditCost in the OpenAPI carries the per-creator
  cost). Credits expire 12 months after purchase.
api_pricing:
  developer_plans_published: false
  detail: >-
    Trend publishes no API access tier, no key pricing and no request quota. The API
    is the platform's own application backend; access is a signed-in brand or creator
    session, not a purchased developer plan.
