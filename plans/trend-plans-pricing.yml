note: >-
  Trend sells creator credits in prepaid packages, not API plans — there is no
  developer plan, no API pricing tier and no metered API billing, because there is
  no developer program. The four packages below were read from a machine-readable
  catalog endpoint on the Trend API itself (GET /payment/stripe/packages, HTTP 200
  unauthenticated, application/json), and independently confirmed against the
  published pricing page. Costs are returned in USD cents by the API and are
  restated here in dollars. Each package maps to a Stripe product id, which the
  API also exposes; those ids are the input to POST
  /payment/stripe/checkout/{productId}.
