apis:
- name: Trend API
  description: >-
    The Trend platform API — the NestJS backend behind app.trend.io and the Trend
    creator app. It exposes 124 operations across brand accounts and approvals,
    campaign creation/submission/relisting, creator profiles, portfolios and levels,
    partnership applications and rehire invites, content submission/approval/revision,
    brand↔creator messaging, product shipments, AI photo generation and
    super-resolution, S3 pre-signed uploads, and Stripe credit-package checkout.
    Authentication is a JWT bearer ("access-token"); 39 admin operations additionally
    require a "trend-api-key" header. There is no published developer program, no
    onboarding for third-party developers, and no rate-limit documentation — but the
    OpenAPI is served publicly and unauthenticated at https://api.trend.io/docs-json.
  humanURL: https://api.trend.io/docs
  baseURL: https://api.trend.io
