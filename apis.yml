aid: trend
name: Trend
description: >-
  Trend (branded "Trend by soona") is a user-generated content (UGC) platform
  that connects brands with a network of vetted independent creators to produce
  custom photo and video content — product and lifestyle photography, testimonial,
  unboxing, and product-in-action videos — optimized for TikTok, Instagram,
  Facebook, YouTube, and Amazon. Brands post a creative brief, hire creators from
  a network of 3,700+, and receive full licensing and distribution rights to the
  delivered content. Pricing is credit-based with no subscriptions or contracts.
  Trend is part of soona.co. It was surfaced as a 500 Global portfolio company and
  added to the API Evangelist network. Trend publishes no developer program or
  developer portal, but the platform's own NestJS backend at api.trend.io serves a
  public, machine-readable OpenAPI 3.0 document at /docs-json covering 124
  operations across brands, campaigns, creators, partnerships, content submission,
  messaging, shipments, AI image generation, and Stripe credit purchases. The
  Swagger UI at /docs is password-protected; the specification behind it is not.
