- from: Campaign
  to: Partnership
  type: has_many
  via: /campaign/approve-partnership/{campaignId}/{partnershipId}
- from: Partnership
  to: Creator
  type: belongs_to
  via: /campaign/invite-creator/{campaignId}/{creatorId}
- from: Partnership
  to: Shipment
  type: has_one
  via: ShipmentDto.partnershipId
- from: Partnership
  to: ContentCollection
  type: has_one
  via: POST /content/submit/{partnershipId}
- from: ContentCollection
  to: Campaign
  type: belongs_to
  via: ContentCollectionResponse.campaign
- from: ContentCollection
  to: Creator
  type: belongs_to
  via: ContentCollectionResponse.creator
- from: ContentCollection
  to: Message
  type: has_one
  via: ContentCollectionResponse.messageId
- from: Brand
  to: Creator
  type: has_many
  via: POST /brand/{brandId}/favorite-creator
- from: Brand
  to: PackageProduct
  type: has_many
  via: POST /payment/stripe/checkout/{productId}
- from: Creator
  to: Review
  type: has_many
  via: PublicProfileResponse.reviews
- from: ProfileDto
  to: Creator
  type: belongs_to
  via: ProfileDto.creatorId
gaps:
- BrandSchema publishes no properties — the central buying entity has no documented shape.
- No Campaign or Partnership response schema is declared; both are addressed only by id.
- No schema declares format, pattern or maxLength on its id fields.
