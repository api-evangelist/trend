      operationId: SystemPartnershipController_systemActivatePartnership
      parameters: []
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Partnership
      security:
      - admin-api-key: []
  /system/partnership/reject-partnership/{partnershipId}:
    patch:
      operationId: SystemPartnershipController_systemRejectInfluencerPartnership
      parameters:
      - name: partnershipId
        required: true
        in: path
        schema:
