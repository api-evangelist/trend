      security:
      - admin-api-key: []
components:
  schemas:
    SubmitApplicationRequestDto:
      type: object
      properties:
        writtenApplication:
          type: string
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
    admin-api-key:
      type: apiKey
      in: header
      name: trend-api-key
