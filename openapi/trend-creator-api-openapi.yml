        payPalEmail:
          type: string
        phoneNumber:
          type: string
        socialCategories:
          type: array
          items:
            type: string
        contentCategories:
          type: array
          items:
            type: string
        socials:
          $ref: '#/components/schemas/SocialProviderDto'
        portfolio:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioDto'
        jobTypes:
          $ref: '#/components/schemas/JobTypeDto'
        gender:
          enum:
          - male
          - female
          - other
          type: string
        ageRange:
          type: string
          enum:
          - 18-24
          - 25-31
          - 32-44
          - 45+
        username:
          type: string
        about:
          type: string
        equipment:
          type: array
          items:
            type: string
        environment:
          type: array
          items:
            type: string
        levelId:
          type: string
        isOverdue:
          type: boolean
        overduePartnerships:
          type: array
          items:
            type: string
        contentDeliveryScore:
          type: number
        contentDeliveryAverageDays:
          type: number
        bypassIsOverdueFlag:
          type: boolean
        firstName:
          type: string
        lastName:
          type: string
        profilePicture:
          type: string
    Address:
      type: object
