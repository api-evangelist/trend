      x-summary-source: derived
  /campaign/update/{campaignId}:
    patch:
      operationId: CampaignController_updateCampaign
      parameters:
      - name: campaignId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActiveCampaign'
      responses:
        '200':
          description: ''
          content:
