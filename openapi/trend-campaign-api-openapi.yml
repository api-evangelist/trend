components:
  schemas:
    IncrementDownloadDto:
      type: object
      properties:
        count:
          type: number
          minimum: 0
        creatorId:
          type: string
        partnershipId:
          type: string
        type:
          type: string
    RemoveCreatorBodyDto:
      type: object
      properties:
        removalReason:
          type: string
      required:
      - removalReason
    CampaignContentSubmissionsResponse:
      type: object
      properties:
        submissions:
          type: array
          items:
            type: object
        approvals:
          type: array
          items:
            type: object
      required:
      - submissions
      - approvals
    UpdateActiveCampaign:
      type: object
      properties:
        category:
          type: string
          enum:
          - pet
          - fashion
          - other
          - trending
          - food
          - technology
          - beverages
          - beauty
          - boxes
          - adventure
          - wellness
          - home
          - fitness
          - travel
          - sports
        platform:
          type: string
          enum:
          - instagram
          - tiktok
          - facebook
          - youtube
          - amazon
          - generalUse
        styleCategory:
          type: array
          items:
            type: string
            enum:
            - productPhotography
            - lifestyleOrActionPhotography
            - portraitStylePhotography
            - actionOrProductInUseVideo
            - unboxingExplanationVideo
            - productReviewOrTestimonialVideo
            - other
        gender:
          type:
          - string
          - 'null'
          enum:
          - male
          - female
          - other
          - null
        name:
          type: string
        url:
          type: string
        value:
          type: number
        userFullName:
          type: string
        companyName:
          type: string
    SubmitCampaignDto:
      type: object
      properties:
        userFullName:
          type: string
        companyName:
          type: string
        type:
          type: string
          enum:
          - image
          - video
          - social
        category:
          type: string
          enum:
          - pet
          - fashion
          - other
          - trending
          - food
          - technology
          - beverages
          - beauty
          - boxes
          - adventure
          - wellness
          - home
          - fitness
          - travel
          - sports
        platform:
          type: string
          enum:
          - instagram
          - tiktok
          - facebook
          - youtube
          - amazon
          - generalUse
        styleCategory:
          type: array
          items:
            type: string
            enum:
            - productPhotography
            - lifestyleOrActionPhotography
            - portraitStylePhotography
            - actionOrProductInUseVideo
            - unboxingExplanationVideo
            - productReviewOrTestimonialVideo
            - other
        gender:
          type:
          - string
          - 'null'
          enum:
          - male
          - female
          - other
          - null
        name:
          type: string
        url:
          type: string
        value:
          type: number
      required:
      - type
      - category
      - platform
      - styleCategory
      - gender
      - name
      - url
      - value
    InviteCreatorBodyDto:
      type: object
      properties:
        rehireContentNeeds:
          type: string
        rehireWillBrandSendProduct:
          type: boolean
        rehireProductDescription:
          type: string
      required:
      - rehireContentNeeds
      - rehireWillBrandSendProduct
    UpdateDraftCampaignDto:
      type: object
      properties:
        type:
          type: string
          enum:
          - image
          - video
          - social
        category:
          type: string
          enum:
          - pet
          - fashion
          - other
          - trending
          - food
          - technology
          - beverages
          - beauty
          - boxes
          - adventure
          - wellness
          - home
          - fitness
          - travel
          - sports
        platform:
          type: string
          enum:
          - instagram
          - tiktok
          - facebook
          - youtube
          - amazon
          - generalUse
        styleCategory:
          type: array
          items:
            type: string
            enum:
            - productPhotography
            - lifestyleOrActionPhotography
            - portraitStylePhotography
            - actionOrProductInUseVideo
            - unboxingExplanationVideo
            - productReviewOrTestimonialVideo
            - other
        gender:
          type:
          - string
          - 'null'
          enum:
          - male
          - female
          - other
          - null
        name:
          type: string
        url:
          type: string
        value:
          type: number
        userFullName:
          type: string
        companyName:
          type: string
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
    admin-api-key:
      type: apiKey
      in: header
      name: trend-api-key
